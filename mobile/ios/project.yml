name: ADBTypeMobile

options:
  bundleIdPrefix: dev.local.adbtype
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  ADBTypeMobile:
    type: application
    platform: iOS
    sources:
      - path: ADBTypeMobile
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.adbtype.mobile
        PRODUCT_NAME: ADBTypeMobile
        INFOPLIST_FILE: ADBTypeMobile/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_EMIT_LOC_STRINGS: YES

  ADBTypeMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ADBTypeMobileTests
    dependencies:
      - target: ADBTypeMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.adbtype.mobile.tests
        GENERATE_INFOPLIST_FILE: YES

  ADBTypeMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ADBTypeMobileUITests
    dependencies:
      - target: ADBTypeMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.adbtype.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ADBTypeMobile

schemes:
  ADBTypeMobile:
    build:
      targets:
        ADBTypeMobile: all
        ADBTypeMobileTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ADBTypeMobileTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  ADBTypeMobileUITests:
    build:
      targets:
        ADBTypeMobile: all
        ADBTypeMobileUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ADBTypeMobileUITests
